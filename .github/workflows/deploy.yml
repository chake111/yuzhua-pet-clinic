name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'tools/**'
      - 'deploy/demo/agent-notes.md'
      - 'deploy/demo/agent-shots/**'
      - '.pr_agent.toml'
      - 'commitlint.config.cjs'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag (full commit SHA) to redeploy. Leave empty to build and deploy the current commit.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/chake111/yuzhua-backend
  WEB_IMAGE: ghcr.io/chake111/yuzhua-web

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment: production
    steps:
      - name: Check secrets and target directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH GHCR_PULL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production secrets: ${missing[*]}"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          printf '%s' "$DEPLOY_PATH" | ssh -i "$HOME/.ssh/deploy_key" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${SSH_HOST}" \
            'p=$(cat); test -d "$p" || { echo "DEPLOY_PATH is not a directory" >&2; exit 1; }; test -f "$p/compose.yaml" || { echo "compose.yaml not found in DEPLOY_PATH" >&2; exit 1; }'

  build:
    name: build-and-push
    needs: preflight
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=yuzhua-backend
          cache-to: type=gha,mode=max,scope=yuzhua-backend
      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          build-args: VITE_DEMO_PASSWORD=${{ vars.DEMO_PASSWORD }}
          cache-from: type=gha,scope=yuzhua-web
          cache-to: type=gha,mode=max,scope=yuzhua-web

  deploy:
    name: deploy
    needs: [preflight, build]
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (
        needs.build.result == 'success' ||
        (
          needs.build.result == 'skipped' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.image_tag != ''
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://yuzhua-petclinic.top/demo
    steps:
      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ needs.build.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes -o BatchMode=yes "${SSH_USER}@${SSH_HOST}")
          printf '%s\n' "$GHCR_PULL_TOKEN" | "${SSH[@]}" "docker login ghcr.io -u chake111 --password-stdin"
          "${SSH[@]}" "set -euo pipefail; cd \"$DEPLOY_PATH\"; docker pull \"${BACKEND_IMAGE}:${IMAGE_TAG}\"; docker pull \"${WEB_IMAGE}:${IMAGE_TAG}\"; docker tag \"${BACKEND_IMAGE}:${IMAGE_TAG}\" yuzhua-backend:local; docker tag \"${WEB_IMAGE}:${IMAGE_TAG}\" yuzhua-web:local; docker compose up -d --no-build --wait --wait-timeout 360; docker logout ghcr.io"
      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          smoke_check() {
            local root_hdr root_gz js_hdr code root_html entry_js
            root_hdr=$(mktemp)
            root_gz=$(mktemp)
            js_hdr=$(mktemp)
            trap "rm -f '$root_hdr' '$root_gz' '$js_hdr'" RETURN

            grep -q '"status":"UP"' < <(curl -fsS https://yuzhua-petclinic.top/api/actuator/health) || return 1
            grep -q '"status":"UP"' < <(curl -fsS https://yuzhua-petclinic.top/api/actuator/health/readiness) || return 1
            curl -fsS -o /dev/null https://yuzhua-petclinic.top/healthz || return 1
            curl -fsS -o /dev/null https://yuzhua-petclinic.top/demo || return 1

            code=$(curl -sS -H 'Accept-Encoding: gzip' -D "$root_hdr" -o "$root_gz" -w '%{http_code}' https://yuzhua-petclinic.top/) || return 1
            [ "$code" = "200" ] || return 1
            tr -d '\r' < "$root_hdr" | grep -qiE '^content-encoding:[[:space:]]*gzip[[:space:]]*$' || return 1
            tr -d '\r' < "$root_hdr" | grep -qiE '^cache-control:.*no-cache' || return 1

            code=$(curl -sS -o /dev/null -w '%{http_code}' https://yuzhua-petclinic.top/demo-preload.json) || return 1
            [ "$code" = "200" ] || return 1

            root_html=$(gzip -dc "$root_gz") || return 1
            entry_js=$(printf '%s' "$root_html" | grep -oE '/assets/index-[^"'"'"'<>[:space:]]+\.js' | head -n 1 || true)
            [ -n "$entry_js" ] || return 1

            code=$(curl -sS -H 'Accept-Encoding: gzip' -D "$js_hdr" -o /dev/null -w '%{http_code}' "https://yuzhua-petclinic.top${entry_js}") || return 1
            [ "$code" = "200" ] || return 1
            tr -d '\r' < "$js_hdr" | grep -qiE '^content-encoding:[[:space:]]*gzip[[:space:]]*$' || return 1
            tr -d '\r' < "$js_hdr" | grep -qiE '^cache-control:.*immutable' || return 1
          }

          ok=0
          for i in $(seq 1 12); do
            if smoke_check; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
