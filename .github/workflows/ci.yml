name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读仓库内容，检出和读取代码足够；不授予写权限。
permissions:
  contents: read

# 同一分支的新运行取消旧运行；group 带上 workflow 与 ref，避免跨工作流互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 测试并打包
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 静态检查
        run: npm run lint

      - name: 样式护栏
        run: npm run style-guard

      - name: 单元测试与覆盖率
        run: npm run test:coverage

      - name: 构建
        run: npm run build

      - name: 包体预算门禁
        run: npm run bundle-budget

      - name: 校验 Dependabot 标题本地化脚本
        working-directory: .
        run: node --test .github/scripts/localize-dependabot.test.mjs