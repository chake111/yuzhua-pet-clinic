<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>%BRAND_TITLE%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <script>if(window.location.pathname==='/'){window.__YUZHUA_HOME_PREFETCH__={ts:Date.now(),promise:fetch('/api/client/catalog/home',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(b=>b&&b.code===200?b.data:null).catch(()=>null)}}</script>
  </head>
  <body>
    <div id="app">
      <style>
        html,body,#app{margin:0;height:100%;background:#f7f7f7}
        .boot-shell{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;pointer-events:none;user-select:none}
        .boot-mark{width:56px;height:56px;margin-bottom:14px;display:block}
        .boot-name{font-size:20px;font-weight:700;letter-spacing:.04em;line-height:1.35;color:#222}
        .boot-tagline{margin-top:6px;font-size:13px;line-height:1.5;color:#6a6a6a}
        .boot-bar{width:136px;height:3px;margin-top:22px;border-radius:999px;background:#e6e6e6;overflow:hidden;position:relative}
        .boot-bar-fill{position:absolute;inset:0 auto 0 0;width:42%;border-radius:999px;background:#ff385c;animation:boot-slide 1.2s cubic-bezier(.4,0,.2,1) infinite}
        .boot-tip{margin-top:10px;font-size:12px;color:#707070}
        @keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
        @media (prefers-reduced-motion:reduce){.boot-bar-fill{animation:none;width:50%;left:25%}}
      </style>
      <div class="boot-shell" role="status" aria-live="polite" aria-label="页面加载中">
        <svg class="boot-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true">
          <circle cx="64" cy="64" r="56" fill="#FF385C" />
          <g fill="#FFFFFF">
            <ellipse cx="34" cy="43" rx="8" ry="11" transform="rotate(-20 34 43)" />
            <ellipse cx="51" cy="31" rx="8" ry="11.5" transform="rotate(-6 51 31)" />
            <ellipse cx="77" cy="31" rx="8" ry="11.5" transform="rotate(6 77 31)" />
            <ellipse cx="94" cy="43" rx="8" ry="11" transform="rotate(20 94 43)" />
            <path fill-rule="evenodd" d="M40 74C40 63 49 56 64 56C79 56 88 63 88 74C88 84 79 92 64 92C49 92 40 84 40 74ZM52 69.5H59.5V62.5H68.5V69.5H76V78.5H68.5V85.5H59.5V78.5H52Z" />
          </g>
        </svg>
        <div class="boot-name">%BRAND_NAME%</div>
        <div class="boot-tagline">%BRAND_TAGLINE%</div>
        <div class="boot-bar" aria-hidden="true"><span class="boot-bar-fill"></span></div>
        <div class="boot-tip">正在加载页面…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
