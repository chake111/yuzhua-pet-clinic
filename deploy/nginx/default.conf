server {
    listen 80;
    server_name _;

    # backend 容器重建后 IP 会变；运行时解析，不把地址钉死在启动时
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8081;

    root /usr/share/nginx/html;
    index index.html;

    # 容器层静态预压缩自治：优先命中构建期生成的 .gz，未命中时走动态 gzip（兼容 HTTP/1.0 回源）
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 构建清单仅供构建后脚本生成预热列表，不对外暴露
    location /.vite/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /demo-preload.json {
        add_header Cache-Control "no-cache";
    }

    # 图文问诊 WebSocket：/api/ws/consult
    # token 在 query 里，关闭访问日志避免 JWT 落盘
    location /api/ws/ {
        access_log off;
        # 上游失败时 nginx 的 error_log 也会带原始请求行，同样避免 token 落盘
        error_log /dev/null crit;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 指标端点只在容器网络内可见；Prometheus 直接抓 backend:8081，不经过 nginx
    location /api/actuator/metrics { return 404; }
    location /api/actuator/prometheus { return 404; }

    # REST、Swagger、上传图片都在 /api 下；proxy_pass 末尾不能加 /，否则前缀会被剥掉
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # 保留端口，Swagger 生成的 servers 才能指回 8088，而不是 80
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout 300s;
    }

    # 品牌落地页。精确 /demo 必须 301 到 /demo/，相对素材路径才会落到 /demo/agent-assets/
    # absolute_redirect 关掉后 Location 保持为 /demo/，避免容器内的 http 方案覆盖外层 https
    location = /demo {
        absolute_redirect off;
        return 301 /demo/;
    }

    location /demo/agent-assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /demo/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /demo/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
