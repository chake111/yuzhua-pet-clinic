name: yuzhua

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${YUZHUA_MYSQL_ROOT_PASSWORD:?set YUZHUA_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: yuzhua
      MYSQL_USER: petapp
      MYSQL_PASSWORD: ${YUZHUA_DB_PASSWORD:?set YUZHUA_DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      # 不只看 TCP 活着，还要确认初始化脚本真的建出了业务表
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u petapp -N -e "SELECT 1 FROM yuzhua.doctor LIMIT 1"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: yuzhua-backend:local
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/yuzhua?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      DB_USERNAME: petapp
      DB_PASSWORD: ${YUZHUA_DB_PASSWORD:?set YUZHUA_DB_PASSWORD in .env}
      JWT_SECRET: ${YUZHUA_JWT_SECRET:?set YUZHUA_JWT_SECRET in .env}
      YUZHUA_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_DEMO_PASSWORD: ${YUZHUA_DEMO_PASSWORD:-123456}
    image: yuzhua-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${YUZHUA_PROM_PORT:-9090}:9090"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${YUZHUA_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${YUZHUA_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  mysql_data:
    # 存量 compose 部署升级时设为旧项目卷名 pet-clinic_mysql_data，先把旧数据挂回来再跑库迁移；
    # 新装保持默认 yuzhua_mysql_data。Docker 不支持重命名卷，详见 docs/部署步骤.md。
    name: ${YUZHUA_MYSQL_VOLUME:-yuzhua_mysql_data}
  uploads_data:
    name: ${YUZHUA_UPLOADS_VOLUME:-yuzhua_uploads_data}
